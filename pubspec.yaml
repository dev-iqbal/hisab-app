name: hisab_app
description: "একটি আধুনিক ও সহজ অফলাইন আয়-ব্যয়ের হিসাব মোবাইল অ্যাপ্লিকেশন।"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # স্টেট ম্যানেজমেন্ট
  provider: ^6.1.2

  # অফলাইন ডেটাবেস
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # আধুনিক চার্ট ও অ্যানিমেশন
  fl_chart: ^0.68.0

  # তারিখ ও সময় ফরম্যাটিং
  intl: ^0.19.0

  # সুন্দর বাংলা গুগল ফন্ট (Hind Siliguri / Noto Sans Bengali)
  google_fonts: ^6.2.1

  # গ্যালারি ও ক্যামেরা থেকে প্রোফাইল ছবি তোলার জন্য
  image_picker: ^1.1.2

  # আইকন ও আধুনিক ডিজাইন উপাদান
  cupertino_icons: ^1.0.8

  # ডেটা এক্সপোর্ট (CSV) ও শেয়ারিং
  csv: ^6.0.0
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
